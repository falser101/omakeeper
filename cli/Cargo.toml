[package]
name = "omakeeper"
version = "0.1.0"
edition = "2021"
description = "System maintenance toolkit for Omarchy Linux"
license = "MIT"
authors = ["falser"]
repository = "https://github.com/falser/omakeeper"
readme = "../README.md"

[[bin]]
name = "omakeeper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
humansize = "2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
